name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: services/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m pip install -r ../worker/requirements.txt
      - run: PYTHONPATH=../worker python -m unittest discover -s ../worker/tests
  frontend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: apps/dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build api worker dashboard
      - name: Exercise API readiness in Compose
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach --wait postgres redis api
          docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"

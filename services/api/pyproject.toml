[project]
name = "mbas-api"
version = "0.1.0"
description = "MANI Business Automation System API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "asyncpg>=0.29,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
